<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Clyde AI</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f6f8;--surface:#fff;--border:#e7e9ee;--text:#111318;--muted:#707783;--red:#c24141}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.wrapper{width:100%;max-width:430px}.brand{text-align:center;margin-bottom:30px}.logo{width:52px;height:52px;margin:0 auto 14px;border-radius:15px;overflow:hidden}.logo img{width:100%;height:100%;display:block}.brand-name{font-size:21px;font-weight:800;letter-spacing:-.6px}.brand-subtitle{margin-top:4px;color:var(--muted);font-size:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:32px;box-shadow:0 18px 50px rgba(17,19,24,.07)}h1{font-size:28px;letter-spacing:-1.3px;margin-bottom:7px}.subtitle{color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:26px}.field{margin-bottom:17px}.field label{display:block;margin-bottom:7px;font-size:12px;font-weight:800}.field input{width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:11px;outline:none;background:#f8f9fb;color:var(--text);font-size:13px}.field input:focus{background:#fff;border-color:#cfd3da;box-shadow:0 0 0 4px rgba(17,19,24,.04)}.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.link{border:0;background:none;color:var(--muted);font-size:11px;cursor:pointer}.button{width:100%;padding:13px;border:0;border-radius:11px;background:var(--text);color:#fff;font-size:13px;font-weight:800;cursor:pointer}.button:disabled{opacity:.6;cursor:wait}.error{display:none;margin-bottom:17px;padding:11px 13px;border-radius:10px;background:#fff0f0;border:1px solid #ffd7d7;color:var(--red);font-size:11px;line-height:1.5}.signup{text-align:center;color:var(--muted);font-size:12px;margin-top:22px}.signup a{color:var(--text);font-weight:800;text-decoration:none}.footer{text-align:center;margin-top:22px;color:#969ca7;font-size:10px}
</style>
</head>
<body>
<main class="wrapper">
<div class="brand"><div class="logo"><img src="/logo.svg" alt="Clyde AI"></div><div class="brand-name">Clyde AI</div><div class="brand-subtitle">AI Career Intelligence</div></div>
<section class="card">
<h1>Welcome back</h1>
<p class="subtitle">Sign in to continue using Clyde AI.</p>
<div class="error" id="error"></div>
<form id="loginForm">
<div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></div>
<div class="field"><div class="row"><label for="password">Password</label><button class="link" type="button" id="forgot">Forgot password?</button></div><input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required></div>
<button class="button" id="submit" type="submit">Sign In</button>
</form>
<div class="signup">Don't have an account? <a href="/signup.html">Create one</a></div>
</section>
<div class="footer">© 2026 Clyde AI · AI-powered career intelligence</div>
</main>
<script>
const SUPABASE_URL="https://bicdawajnksfzvjmgjsk.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_hyzGSOqm-_UAbetcT77mOA_OVunKQ05";
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const form=document.getElementById("loginForm"), button=document.getElementById("submit"), error=document.getElementById("error");
function showError(message){error.textContent=message;error.style.display="block"}
form.addEventListener("submit",async(e)=>{e.preventDefault();error.style.display="none";button.disabled=true;button.textContent="Signing in...";try{const {error:authError}=await supabase.auth.signInWithPassword({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});if(authError)throw authError;window.location.href="/"}catch(err){showError(err.message||"Unable to sign in.")}finally{button.disabled=false;button.textContent="Sign In"}});
document.getElementById("forgot").addEventListener("click",async()=>{const email=document.getElementById("email").value.trim();if(!email){showError("Enter your email address first.");return}const {error:resetError}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+"/"});if(resetError)showError(resetError.message);else{error.style.display="block";error.style.background="#edf8f2";error.style.borderColor="#d3f0df";error.style.color="#167a49";error.textContent="Password reset instructions have been sent to your email."}});
</script>
</body>
</html>
